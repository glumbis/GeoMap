# Render blueprint: runs the published image (built by .github/workflows/docker.yml). See docs/DEPLOY.md.
services:
  - type: web
    name: omnium
    runtime: image
    image:
      url: ghcr.io/glumbis/geomap:latest
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      # 512 MB instance: keep DuckDB small so Chromium fits for the PDF report.
      - key: DUCKDB_MEMORY_LIMIT
        value: 160MB
      - key: NODE_OPTIONS
        value: --max-old-space-size=128
