# Render blueprint: runs the published image (built by .github/workflows/docker.yml). See docs/DEPLOY.md.
services:
  - type: web
    name: omnium
    runtime: image
    image:
      url: ghcr.io/glumbis/geomap:latest
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      # 512 MB is too little for Chromium next to the database: the visitor's browser prints the report instead.
      - key: REPORT_PRINT
        value: browser
