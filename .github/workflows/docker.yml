# Build the whole site (code + freshly downloaded open data) as one Docker image and publish it:
#   ghcr.io/glumbis/geomap:latest   -> docker run -p 3000:3000 ghcr.io/glumbis/geomap
# Runs on every push to main. The data layer comes from the build cache unless data/scripts/ changed.
# Run it by hand ("Run workflow") with "fresh data" to download everything again.
name: Docker image
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fresh:
        description: Download all data again (ignore the build cache)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker
  # Let a running build finish (the team pushes often); only the newest waiting push builds next.
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/geomap:latest
            ghcr.io/${{ github.repository_owner }}/geomap:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          no-cache: ${{ inputs.fresh == true }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Tell Render to pull the new image. The hook URL is a repo secret (Render: service -> Settings -> Deploy Hook).
      - name: Redeploy on Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK"
